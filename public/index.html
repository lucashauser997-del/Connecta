<!doctype html>
<html lang="de" data-theme="connecta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060b">
<title>Connecta</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Login / Registrierung ===== -->
<section id="auth">
  <div class="card">
    <img class="logo-img" alt="Connecta">
    <h1 class="grad-text">Connecta</h1>
    <p>Chatten & telefonieren – nur mit Username.</p>
    <div class="tabs"><button class="on" data-mode="login">Anmelden</button><button data-mode="register">Registrieren</button></div>
    <form id="authForm">
      <input class="input" id="u" placeholder="Username" autocomplete="username" autocapitalize="off" required>
      <input class="input" id="p" type="password" placeholder="Passwort" autocomplete="current-password" required>
      <div class="err" id="authErr"></div>
      <button class="btn" id="authBtn">Anmelden</button>
    </form>
  </div>
</section>

<!-- ===== App ===== -->
<section id="app" class="hidden">
  <nav class="rail">
    <img class="logo logo-img" alt="Connecta">
    <div class="sep"></div>
    <button class="rb" data-view="chats" title="Chats" id="rbChats"></button>
    <button class="rb" data-view="friends" title="Freunde" id="rbFriends"></button>
    <button class="rb" id="rbGroup" title="Gruppe erstellen"></button>
    <div class="spacer"></div>
    <button class="rb" id="rbMe" title="Status & Einstellungen"></button>
  </nav>

  <aside class="side">
    <div class="side-head"><h2 id="sideTitle">Chats</h2><span id="sideBtns"></span></div>
    <div class="searchbox"><span id="searchIcon"></span><input class="input" id="search" placeholder="Suchen" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main" id="main">
    <div class="welcome" id="welcome">
      <div>
        <img class="logo-img" alt="">
        <h2 class="grad-text">Willkommen bei Connecta</h2>
        <p>Wähle einen Chat aus, füge Freunde hinzu oder erstelle eine Gruppe.</p>
        <div class="btns"><button class="btn" data-view="friends">Freunde finden</button><button class="btn ghost" id="welcomeGroup">Gruppe erstellen</button></div>
      </div>
    </div>
    <div id="chat" class="hidden">
      <div class="chat-head" id="chatHead"></div>
      <div class="pinbar hidden" id="pinBar"></div>
      <div class="msgs" id="msgs"></div>
      <div class="typing" id="typing"></div>
      <div class="composer-wrap">
        <div class="mentionbox hidden" id="mentionBox"></div>
        <div class="tray hidden" id="tray"></div>
        <form class="composer" id="composer">
          <button type="button" class="cbtn" id="attachBtn" title="Bild, Video oder Audio senden"></button>
          <textarea class="input" id="text" rows="1" placeholder="Nachricht schreiben…" autocomplete="off"></textarea>
          <button class="send" title="Senden" id="sendBtn"></button>
        </form>
        <div class="recbar hidden" id="recBar"></div>
      </div>
      <div class="dropzone hidden" id="dropzone"><div>📎<br>Dateien hier ablegen</div></div>
    </div>
  </main>

  <aside class="panel hidden" id="panel"></aside>
</section>

<div id="statusMenu" class="popover hidden"></div>
<div id="modal" class="hidden"></div>
<div id="lightbox" class="hidden"></div>

<!-- ===== Anruf ===== -->
<section id="call" class="hidden">
  <div class="videos" id="videos"><video id="remoteV" autoplay playsinline></video><video id="localV" autoplay playsinline muted></video></div>
  <audio id="remoteA" autoplay></audio>
  <div id="callAv" class="pulse"></div>
  <h2 id="callName"></h2>
  <div class="status" id="callStatus"></div>
  <div class="sbtoast hidden" id="sbToast"></div>
  <div class="soundboard hidden" id="soundboard"></div>
  <div class="call-btns">
    <button class="ibtn green hidden" id="acceptCall" title="Annehmen"></button>
    <button class="ibtn" id="muteBtn" title="Stummschalten"></button>
    <button class="ibtn" id="camBtn" title="Kamera"></button>
    <button class="ibtn" id="sbBtn" title="Soundboard"></button>
    <button class="ibtn red" id="hangup" title="Auflegen"></button>
  </div>
</section>

<div id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="sounds.js"></script>
<script src="app.js"></script>
</body>
</html>
