<!doctype html>
<html lang="de" data-theme="connecta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connecta</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Farbschemata ===== */
:root,[data-theme=connecta]{
  --bg:#07060b;--rail:#0b0912;--panel:#110e1a;--panel2:#1a1528;--panel3:#231c36;--line:#2a2240;
  --text:#f3efff;--muted:#9d93b8;--in:#1f1830;--chat:#0c0a14;
  --bgimg:radial-gradient(900px 600px at 10% -10%,#2b126099 0%,transparent 60%),radial-gradient(800px 600px at 110% 110%,#3b147099 0%,transparent 60%);
  --chatimg:radial-gradient(600px 400px at 80% 0%,#5b21ff22,transparent 70%),radial-gradient(500px 400px at 0% 100%,#d89cff14,transparent 70%);
  --shadow:0 20px 60px -20px #000c;
}
[data-theme=dark]{
  --bg:#111214;--rail:#111214;--panel:#1e1f22;--panel2:#2b2d31;--panel3:#35373c;--line:#2f3136;
  --text:#f2f3f5;--muted:#a5a8ad;--in:#2b2d31;--chat:#18191c;
  --bgimg:none;--chatimg:none;--shadow:0 20px 60px -20px #000a;
}
[data-theme=light]{
  --bg:#efedf6;--rail:#e6e2f1;--panel:#ffffff;--panel2:#f1edf9;--panel3:#e7e0f5;--line:#e4def0;
  --text:#1b1530;--muted:#6e6787;--in:#ffffff;--chat:#f6f3fc;
  --bgimg:none;--chatimg:radial-gradient(600px 400px at 80% 0%,#8b4dff12,transparent 70%);--shadow:0 20px 60px -20px #3b1a7a40;
}
:root{--grad:linear-gradient(135deg,#5b21ff 0%,#8b4dff 50%,#d89cff 100%);--accent:#8b4dff;--r:22px;--green:#3ddc97;--red:#ff4d7d}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);background-image:var(--bgimg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
button{cursor:pointer}
a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.hidden{display:none!important}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
svg{width:20px;height:20px;flex-shrink:0}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

.btn{background:var(--grad);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;box-shadow:0 8px 24px -10px #8b4dffcc;transition:transform .15s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:disabled{opacity:.5;transform:none;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:none}
.btn.danger{background:#ff4d7d1f;color:var(--red);box-shadow:none}
.btn.small{padding:7px 14px;font-size:14px}
.btn.block{width:100%}
.input{width:100%;background:var(--panel2);border:1.5px solid transparent;padding:12px 18px;border-radius:18px;transition:border .15s}
.input:focus{border-color:var(--accent)}
textarea.input{resize:none;line-height:1.4}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s;position:relative}
.ibtn:hover,.ibtn.on{background:var(--panel2);color:var(--text)}
.label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ===== Avatare ===== */
.av{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;position:relative;flex-shrink:0;user-select:none}
.av img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
.av.grp{border-radius:16px}
.av.s{width:34px;height:34px;font-size:14px}.av.s.grp{border-radius:12px}
.av.m{width:56px;height:56px;font-size:22px}
.av.l{width:80px;height:80px;font-size:32px}.av.l.grp{border-radius:26px}
.av.xl{width:104px;height:104px;font-size:42px}.av.xl.grp{border-radius:32px}
.dot{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--green);border:3px solid var(--panel)}
.av.l .dot,.av.xl .dot{width:24px;height:24px;border-width:5px;right:2px;bottom:2px}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:900;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}

/* ===== Login ===== */
#auth{height:100%;display:grid;place-items:center;padding:16px;overflow:auto}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:32px;padding:36px 28px;text-align:center;box-shadow:var(--shadow)}
.card img{width:96px;filter:drop-shadow(0 0 30px #8b4dff88)}
.card h1{font-size:40px;font-weight:900;margin:6px 0 4px}
.card p{color:var(--muted);margin-bottom:24px}
.card form{display:grid;gap:12px}
.tabs{display:flex;background:var(--panel2);border-radius:999px;padding:5px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:999px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--grad);color:#fff}
.err{color:var(--red);min-height:20px;font-size:14px}

/* ===== App-Layout ===== */
#app{height:100%;display:flex;position:relative}
.rail{width:76px;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;flex-shrink:0}
.rail .logo{width:44px;margin-bottom:6px;filter:drop-shadow(0 0 14px #8b4dff66)}
.rail .sep{width:32px;height:2px;border-radius:2px;background:var(--line)}
.rail .spacer{flex:1}
.rb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--panel2);position:relative;transition:border-radius .2s,background .2s,color .2s}
.rb:hover,.rb.on{border-radius:16px;background:var(--grad);color:#fff}
.rb.on::before{content:"";position:absolute;left:-13px;width:5px;height:28px;border-radius:0 5px 5px 0;background:var(--text)}
.rb .badge{position:absolute;right:-4px;bottom:-4px;border:3px solid var(--rail);height:24px}
.rb .av{width:50px;height:50px}

.side{width:330px;background:var(--panel);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--line);min-height:0}
.side-head{display:flex;align-items:center;gap:8px;padding:18px 16px 10px}
.side-head h2{flex:1;font-size:24px;font-weight:900}
.searchbox{position:relative;margin:4px 16px 10px}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.searchbox .input{padding-left:42px;border-radius:999px}
.list{flex:1;overflow-y:auto;padding:0 8px 12px}
.section{padding:14px 10px 6px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;cursor:pointer;transition:background .12s}
.item:hover{background:var(--panel2)}
.item.on{background:var(--panel3)}
.ic{flex:1;min-width:0}
.ir{display:flex;align-items:center;gap:8px}
.ir b{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ir .tm{font-size:12px;color:var(--muted);font-weight:700}
.ir .pv{flex:1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.unread .pv{color:var(--text);font-weight:700}
.item .acts2{display:flex;gap:4px}
.item .acts2 .ibtn{background:var(--panel2)}
.item .acts2 .ibtn:hover{background:var(--grad);color:#fff}
.emptylist{color:var(--muted);text-align:center;padding:30px 16px;font-size:14px;display:grid;gap:14px;justify-items:center}

/* ===== Chat ===== */
.main{flex:1;display:flex;flex-direction:column;background:var(--chat);background-image:var(--chatimg);min-width:0;min-height:0}
.welcome{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
.welcome img{width:130px;filter:drop-shadow(0 0 40px #8b4dff66);margin-bottom:14px}
.welcome h2{font-size:28px;font-weight:900;margin-bottom:6px}
.welcome .btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{height:68px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.chat-head .who-box{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:12px}
.chat-head .t{font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .st{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .ibtn .badge{position:absolute;top:0;right:0;min-width:16px;height:16px;font-size:10px;padding:0 4px;background:var(--accent)}
.back{display:none}
.pinbar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.pinbar svg{color:var(--accent)}
.pinbar .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinbar b{color:var(--accent)}

.msgs{flex:1;overflow-y:auto;padding:12px 18px 6px;display:flex;flex-direction:column}
.msgs .first{margin:auto;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:8px;padding:30px}
.day{align-self:center;margin:16px 0 6px;font-size:12px;font-weight:800;padding:5px 14px;border-radius:999px;background:var(--panel);color:var(--muted);box-shadow:0 2px 10px -6px #0006}
.sys{align-self:center;font-size:13px;color:var(--muted);margin:8px 0;background:var(--panel);padding:6px 14px;border-radius:999px;text-align:center;max-width:85%}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:10px;position:relative}
.row.cont{margin-top:3px}
.row.out{flex-direction:row-reverse}
.mav{width:34px;flex-shrink:0;cursor:pointer}
.bubble{max-width:min(72%,580px);padding:8px 13px 7px;border-radius:20px;background:var(--in);position:relative;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.42;box-shadow:0 1px 2px #0002}
.row.in:not(.cont) .bubble{border-top-left-radius:6px}
.row.out:not(.cont) .bubble{border-top-right-radius:6px}
.row.out .bubble{background:var(--grad);color:#fff}
.row.out .bubble a{color:#fff}
.row.pinned .bubble{box-shadow:0 0 0 2px #d89cff99}
.bubble .who{font-size:13px;font-weight:900;margin-bottom:1px;cursor:pointer;color:var(--accent)}
[data-theme=connecta] .bubble .who,[data-theme=dark] .bubble .who{color:#c49bff}
.bubble .meta{float:right;font-size:11px;opacity:.7;margin:7px 0 -3px 12px;white-space:nowrap;font-weight:700}
.bubble.del{font-style:italic;opacity:.6;background:transparent!important;border:1.5px dashed var(--line);color:var(--muted)!important;box-shadow:none}
.bubble.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px #d89cff}100%{box-shadow:0 0 0 0 transparent}}
.acts{display:flex;gap:2px;align-self:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:var(--shadow)}
.row:hover .acts,.row.sel .acts{opacity:1;pointer-events:auto}
.acts button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.acts button:hover{background:var(--panel2);color:var(--text)}
.acts button.d:hover{color:var(--red)}
.acts svg{width:17px;height:17px}
.typing{color:var(--muted);font-size:13px;padding:0 22px;height:22px;font-weight:700;display:flex;align-items:center;gap:6px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;align-items:flex-end;gap:10px;padding:10px 14px 14px;flex-shrink:0}
.composer .input{border-radius:24px;max-height:150px;min-height:48px;padding:13px 20px;background:var(--panel);border-color:var(--line)}
.composer .input:focus{border-color:var(--accent)}
.send{width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 24px -10px #8b4dffcc;transition:transform .15s}
.send:hover{transform:scale(1.06)}

/* ===== Seitenpanel ===== */
.panel{width:340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;min-height:0}
.panel-head{height:68px;display:flex;align-items:center;gap:8px;padding:0 10px 0 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.panel-head h3{flex:1;font-weight:900}
.panel-body{flex:1;overflow-y:auto;padding:16px}
.pcard{background:var(--panel2);border-radius:24px;overflow:hidden}
.pcard .banner{height:120px;background:var(--grad);background-size:cover;background-position:center}
.pcard .pc{padding:0 18px 18px}
.pcard .av.xl{margin-top:-52px;box-shadow:0 0 0 6px var(--panel2)}
.pcard .av.xl .dot{border-color:var(--panel2)}
.pc-name{font-size:22px;font-weight:900;margin-top:8px;overflow-wrap:anywhere}
.pc-user{color:var(--muted);font-size:14px;font-weight:700}
.chip{display:inline-block;background:var(--panel3);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-top:8px}
.pc-sec{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pc-sec p{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.pbtns{display:grid;gap:8px;margin-top:14px}
.pbtns.row2{grid-template-columns:1fr 1fr}
.ghead{text-align:center;display:grid;justify-items:center;gap:6px;padding:8px 0 16px}
.ghead .gn{font-size:22px;font-weight:900;overflow-wrap:anywhere}
.ghead .av{cursor:pointer}
.ghead .av::after{content:"📷";position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;font-size:16px;border:4px solid var(--panel)}
.tag{font-size:11px;font-weight:900;color:var(--accent);background:#8b4dff22;padding:2px 8px;border-radius:999px}
.pinitem{background:var(--panel2);border-radius:18px;padding:12px;margin-bottom:10px}
.pinitem .ph{display:flex;align-items:center;gap:8px;font-size:14px}
.pinitem .ph b{flex:1}
.pinitem .ph span{color:var(--muted);font-size:12px}
.pinitem p{margin:8px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.pinitem .pa{display:flex;gap:6px}

/* ===== Modale ===== */
#modal{position:fixed;inset:0;background:#05030acc;backdrop-filter:blur(8px);display:grid;place-items:center;z-index:30;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:30px;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:var(--shadow);animation:pop .18s}
.mbox.wide{max-width:820px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.mhead{display:flex;align-items:center;gap:8px;padding:20px 16px 4px 24px}
.mhead h3{flex:1;font-size:22px;font-weight:900}
.mbody{padding:12px 24px 24px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field .cnt{font-size:12px;color:var(--muted);text-align:right}
.stabs{display:flex;gap:6px;padding:4px 24px 0;flex-wrap:wrap}
.stabs button{padding:9px 16px;border-radius:999px;font-weight:800;color:var(--muted);background:var(--panel2)}
.stabs button.on{background:var(--grad);color:#fff}
.sgrid{display:grid;grid-template-columns:1fr 300px;gap:22px}
.imgrow{display:flex;gap:8px;flex-wrap:wrap}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcard{border-radius:22px;padding:10px;border:2.5px solid var(--line);cursor:pointer;text-align:center;font-weight:800;transition:border .15s}
.tcard.on{border-color:var(--accent)}
.tprev{height:110px;border-radius:14px;margin-bottom:8px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.tprev i{height:16px;border-radius:10px;display:block}
.tprev i:first-child{width:60%}
.tprev i:last-child{width:50%;align-self:flex-end;background:var(--grad)}
.pick{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;cursor:pointer}
.pick:hover{background:var(--panel2)}
.pick b{flex:1}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.pick.on .check{background:var(--grad);border-color:transparent;color:#fff}
.check svg{width:14px;height:14px}
.picklist{max-height:300px;overflow-y:auto;margin:10px -10px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips span{background:var(--panel3);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800}
.gimg{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.gimg .av{cursor:pointer}

/* ===== Anruf ===== */
#call{position:fixed;inset:0;background:var(--bg);background-image:var(--bgimg);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
#call h2{font-size:30px;font-weight:900}
#call .status{color:var(--muted);font-weight:700}
.videos{position:relative;width:100%;max-width:960px;flex:1;max-height:70vh;border-radius:30px;overflow:hidden;background:var(--panel)}
.videos video{width:100%;height:100%;object-fit:cover}
#localV{position:absolute;right:14px;bottom:14px;width:26%;height:auto;aspect-ratio:4/3;border-radius:20px;border:2px solid var(--accent);background:#000}
.call-btns{display:flex;gap:14px;background:var(--panel);padding:12px;border-radius:999px;box-shadow:var(--shadow)}
.call-btns .ibtn{width:58px;height:58px;background:var(--panel2);color:var(--text)}
.call-btns .ibtn.red{background:var(--red);color:#fff}
.call-btns .ibtn.green{background:var(--green);color:#fff}
.call-btns .ibtn.off{background:var(--text);color:var(--bg)}
.call-btns svg{width:24px;height:24px}
.pulse{border-radius:50%;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #8b4dff99}70%{box-shadow:0 0 0 34px #8b4dff00}100%{box-shadow:0 0 0 0 #8b4dff00}}

#toasts{position:fixed;right:18px;top:18px;display:grid;gap:10px;z-index:50}
.toast{background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;max-width:340px;cursor:pointer;animation:pop .2s}
.toast div{min-width:0}.toast b{display:block}.toast span{color:var(--muted);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Responsiv ===== */
@media (max-width:1150px) and (min-width:761px){ .panel{position:absolute;right:0;top:0;bottom:0;z-index:8;box-shadow:var(--shadow)} }
@media (max-width:860px){ .sgrid{grid-template-columns:1fr} }
@media (max-width:760px){
  #app{flex-direction:column}
  .rail{order:2;flex-direction:row;width:100%;height:68px;justify-content:space-around;padding:0 10px;border-top:1px solid var(--line)}
  .rail .logo,.rail .spacer,.rail .sep{display:none}
  .rb.on::before{display:none}
  .rb,.rb .av{width:46px;height:46px}
  .side{width:100%;flex:1;border:0}
  .main{display:none}
  #app.chatting .side,#app.chatting .rail{display:none}
  #app.chatting .main{display:flex}
  .panel{position:fixed;inset:0;width:100%;z-index:20}
  .back{display:grid}
  .bubble{max-width:82%}
  .acts{position:absolute;top:-38px;right:0;z-index:2}
  .row.in .acts{left:0;right:auto}
  .row:hover .acts{opacity:0;pointer-events:none}
  .row.sel .acts{opacity:1;pointer-events:auto}
  .mbox{border-radius:26px}
  .themes{grid-template-columns:1fr}
  .tprev{height:70px}
  #toasts{left:12px;right:12px;top:12px}
}
</style>
</head>
<body>

<!-- ===== Login / Registrierung ===== -->
<section id="auth">
  <div class="card">
    <img src="logo.svg" alt="">
    <h1 class="grad-text">Connecta</h1>
    <p>Chatten & telefonieren – nur mit Username.</p>
    <div class="tabs"><button class="on" data-mode="login">Anmelden</button><button data-mode="register">Registrieren</button></div>
    <form id="authForm">
      <input class="input" id="u" placeholder="Username" autocomplete="username" autocapitalize="off" required>
      <input class="input" id="p" type="password" placeholder="Passwort" autocomplete="current-password" required>
      <div class="err" id="authErr"></div>
      <button class="btn" id="authBtn">Anmelden</button>
    </form>
  </div>
</section>

<!-- ===== App ===== -->
<section id="app" class="hidden">
  <nav class="rail">
    <img class="logo" src="logo.svg" alt="Connecta">
    <div class="sep"></div>
    <button class="rb" data-view="chats" title="Chats" id="rbChats"></button>
    <button class="rb" data-view="friends" title="Freunde" id="rbFriends"></button>
    <button class="rb" id="rbGroup" title="Gruppe erstellen"></button>

    <button class="rb" id="rbMe" title="Einstellungen"></button>
  </nav>

  <aside class="side">
    <div class="side-head"><h2 id="sideTitle">Chats</h2><span id="sideBtns"></span></div>
    <div class="searchbox"><span id="searchIcon"></span><input class="input" id="search" placeholder="Suchen" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <div class="welcome" id="welcome">
      <div>
        <img src="logo.svg" alt="">
        <h2 class="grad-text">Willkommen bei Connecta</h2>
        <p>Wähle einen Chat aus, füge Freunde hinzu oder erstelle eine Gruppe.</p>
        <div class="btns"><button class="btn" data-view="friends">Freunde finden</button><button class="btn ghost" id="welcomeGroup">Gruppe erstellen</button></div>

      </form>

  <aside class="panel hidden" id="panel"></aside>
</section>

<div id="modal" class="hidden"></div>

<!-- ===== Anruf ===== -->
<section id="call" class="hidden">
  <div class="videos" id="videos"><video id="remoteV" autoplay playsinline></video><video id="localV" autoplay playsinline muted></video></div>
  <div id="callAv" class="pulse"></div>
  <h2 id="callName"></h2>
  <div class="status" id="callStatus"></div>
  <div class="call-btns">
    <button class="ibtn green hidden" id="acceptCall" title="Annehmen"></button>
    <button class="ibtn" id="muteBtn" title="Stummschalten"></button>
    <button class="ibtn" id="camBtn" title="Kamera"></button>
    <button class="ibtn red" id="hangup" title="Auflegen"></button>
  </div>
</section>

<div id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ================= Hilfsfunktionen ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const ic = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  chat: ic('<path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.5-5A8.5 8.5 0 1 1 21 12z"/>'),
  users: ic('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>'),
  phone: ic('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>'),
  video: ic('<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="3"/>'),
  pin: ic('<path d="M12 17v5M9 10.8V4h6v6.8l3 3.2v2H6v-2z"/>'),
  trash: ic('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
  copy: ic('<rect x="9" y="9" width="13" height="13" rx="3"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  info: ic('<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'),
  back: ic('<path d="M15 18l-6-6 6-6"/>'),
  send: ic('<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'),
  x: ic('<path d="M18 6L6 18M6 6l12 12"/>'),
  check: ic('<path d="M20 6L9 17l-5-5"/>'),
  mic: ic('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/>'),
  search: ic('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
  userPlus: ic('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>'),
  logout: ic('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/>'),
  edit: ic('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  more: ic('<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'),
};
function toast(title, text, onclick, avatarHtml) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.innerHTML = (avatarHtml || '') + `<div><b>${esc(title)}</b>${text ? `<span>${esc(text)}</span>` : ''}</div>`;
  d.onclick = () => { d.remove(); onclick && onclick(); };
  $('toasts').append(d);
  setTimeout(() => d.remove(), 4000);
}
const fmtTime = (t) => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const dayKey = (t) => new Date(t).toDateString();
function fmtDay(t) {
  const d = new Date(t), now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'Heute';
  if (d.toDateString() === y.toDateString()) return 'Gestern';
  return d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) });
}
function fmtShort(t) {
  const d = fmtDay(t);
  if (d === 'Heute') return fmtTime(t);
  if (d === 'Gestern') return d;
  return new Date(t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
// Bild auswählen, zuschneiden und verkleinern
function pickImage(w, h) {
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files[0];
      if (!f) return;
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const s = Math.max(w / img.width, h / img.height), dw = img.width * s, dh = img.height * s;
        c.getContext('2d').drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.86));
      };
      img.onerror = () => toast('Das Bild konnte nicht geladen werden.');
      img.src = URL.createObjectURL(f);
    };
    inp.click();
  });
}

/* ================= Farbschema ================= */
function applyTheme(t) { document.documentElement.dataset.theme = t; S.theme = t; store.set('theme', t); }

/* ================= Zustand ================= */
let socket;
let S = { me: null, theme: store.get('theme') || 'connecta', people: {}, friends: [], incoming: [], outgoing: [], groups: [], last: {} };
document.documentElement.dataset.theme = S.theme;
let view = 'chats', current = null, msgs = [], unread = {}, panelMode = null, typingMap = {};
const P = (u) => S.people[u] || { username: u, displayName: '' };
const dn = (u) => (u && (P(u).displayName || u)) || '';
const dmId = (a, b) => 'dm:' + [a, b].sort().join('|');
const isDM = (c) => c.startsWith('dm:');
const other = (c) => c.slice(3).split('|').find((x) => x !== S.me) || S.me;
const grp = (id) => S.groups.find((g) => g.id === id);
function avatar(u, cls = '', dot = false) {
  const p = P(u);
  const inner = p.avatarV ? `<img src="/api/img/avatar/${encodeURIComponent(u)}?v=${p.avatarV}" alt="">` : esc((dn(u)[0] || '?').toUpperCase());
  return `<div class="av ${cls}">${inner}${dot && p.online ? '<span class="dot"></span>' : ''}</div>`;
}
function gAvatar(g, cls = '', src) {
  const inner = src ? `<img src="${src}" alt="">` : g.avatarV ? `<img src="/api/img/group/${encodeURIComponent(g.id)}?v=${g.avatarV}" alt="">` : esc((g.name[0] || '#').toUpperCase());
  return `<div class="av grp ${cls}">${inner}</div>`;
}
const convAvatar = (c, cls = '', dot = false) => isDM(c) ? avatar(other(c), cls, dot) : grp(c) ? gAvatar(grp(c), cls) : '';
const convTitle = (c) => isDM(c) ? dn(other(c)) : (grp(c) || {}).name || 'Gruppe';
const canOpen = (c) => isDM(c) ? S.friends.includes(other(c)) : !!grp(c);

/* ================= Login ================= */
let mode = 'login';
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('authBtn').textContent = mode === 'login' ? 'Anmelden' : 'Konto erstellen';
  $('authErr').textContent = '';
});
$('authForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await fetch('/api/' + mode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('u').value, password: $('p').value }) });
    const d = await r.json();
    if (!r.ok) return $('authErr').textContent = d.error;
    store.set('token', d.token);
    start(d.token);
  } catch { $('authErr').textContent = 'Server nicht erreichbar.'; }
};
function logout() { store.del('token'); location.reload(); }

/* ================= Start & Echtzeit ================= */
function start(token) {
  socket = io({ auth: { token } });
  socket.on('connect_error', (err) => { if (err.message === 'unauthorized') logout(); });
  socket.on('state', (s) => {
    const first = !S.me;
    Object.assign(S, s);
    if (s.theme && document.documentElement.dataset.theme !== s.theme) applyTheme(s.theme);
    if (first) { $('auth').classList.add('hidden'); $('app').classList.remove('hidden'); }
    if (current && !canOpen(current)) closeChat();
    renderAll();
  });
  socket.on('message', (m) => {
    S.last[m.conv] = m;
    if (m.conv === current) {
      msgs.push(m);
      if (typingMap[m.conv]) delete typingMap[m.conv][m.from];
      renderMsgs(m.from === S.me); renderTyping();
      if (document.hidden && !m.system && m.from !== S.me) bumpTitle();
    } else if (!m.system && m.from !== S.me) {
      unread[m.conv] = (unread[m.conv] || 0) + 1;
      toast(convTitle(m.conv), (isDM(m.conv) ? '' : dn(m.from) + ': ') + m.text, () => openConv(m.conv), convAvatar(m.conv, 's'));
      bumpTitle();
    }
    renderSide(); renderRail();
  });
  socket.on('message:update', (m) => {
    if (S.last[m.conv] && S.last[m.conv].id === m.id) S.last[m.conv] = m;
    if (m.conv === current) {
      const i = msgs.findIndex((x) => x.id === m.id);
      if (i >= 0) msgs[i] = m;
      renderMsgs(); renderPinBar(); renderHead();
      if (panelMode === 'pins') renderPanel();
    }
    if (view === 'chats') renderSide();
  });
  socket.on('typing', ({ conv, from }) => {
    (typingMap[conv] = typingMap[conv] || {})[from] = Date.now();
    renderTyping(); setTimeout(renderTyping, 2700);
  });
  setupCalls();
}
if (store.get('token')) start(store.get('token'));

function bumpTitle() {
  const n = Object.values(unread).reduce((a, b) => a + b, 0);
  document.title = n ? `(${n}) Connecta` : 'Connecta';
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) bumpTitle(); });

/* ================= Rendern ================= */
function renderAll() { renderRail(); renderSide(); if (current) { renderHead(); renderMsgs(); renderPinBar(); } if (panelMode) renderPanel(); }

function renderRail() {
  const totalUnread = Object.values(unread).reduce((a, b) => a + b, 0);
  $('rbChats').innerHTML = I.chat + (totalUnread ? `<span class="badge">${totalUnread > 99 ? '99+' : totalUnread}</span>` : '');
  $('rbFriends').innerHTML = I.users + (S.incoming.length ? `<span class="badge">${S.incoming.length}</span>` : '');
  $('rbGroup').innerHTML = I.plus;
  $('rbMe').innerHTML = S.me ? avatar(S.me, '', true) : '';
  document.querySelectorAll('.rail [data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
}

function renderSide() {
  $('sideTitle').textContent = view === 'chats' ? 'Chats' : 'Freunde';
  $('sideBtns').innerHTML = view === 'chats' ? `<button class="ibtn" id="sideGroup" title="Gruppe erstellen">${I.edit}</button>` : '';
  $('search').placeholder = view === 'chats' ? 'Chats durchsuchen' : 'Username suchen & adden';
  if (view === 'chats') renderChats(); else renderFriends();
}

function preview(c) {
  const l = S.last[c];
  if (!l) return 'Gruppe erstellt';
  if (l.system) return l.text;
  if (l.deleted) return '🚫 Nachricht gelöscht';
  const pre = l.from === S.me ? 'Du: ' : !isDM(c) ? dn(l.from) + ': ' : '';
  return pre + l.text.split('\n')[0];
}

function renderChats() {
  const q = $('search').value.trim().toLowerCase();
  const convs = [...S.friends.map((f) => dmId(S.me, f)).filter((c) => S.last[c]), ...S.groups.map((g) => g.id)]
    .filter((c) => !q || convTitle(c).toLowerCase().includes(q))
    .sort((a, b) => ((S.last[b] || {}).at || (grp(b) || {}).created || 0) - ((S.last[a] || {}).at || (grp(a) || {}).created || 0));
  if (!convs.length) {
    $('list').innerHTML = `<div class="emptylist">${q ? 'Nichts gefunden.' : 'Noch keine Chats.<br>Schreib einem Freund oder erstelle eine Gruppe.'}${q ? '' : `<button class="btn small" data-view="friends">Freunde ansehen</button>`}</div>`;
    return;
  }
  $('list').innerHTML = convs.map((c) => {
    const l = S.last[c], n = unread[c] || 0;
    return `<div class="item ${c === current ? 'on' : ''} ${n ? 'unread' : ''}" data-conv="${esc(c)}">${convAvatar(c, '', true)}<div class="ic"><div class="ir"><b>${esc(convTitle(c))}</b><span class="tm">${l ? fmtShort(l.at) : ''}</span></div><div class="ir"><span class="pv">${esc(preview(c))}</span>${n ? `<span class="badge">${n}</span>` : ''}</div></div></div>`;
  }).join('');
}

let searchResults = [], sTimer;
function renderFriends() {
  const q = $('search').value.trim();
  let h = '';
  if (q) {
    h += `<div class="section label">Suchergebnisse</div>`;
    h += searchResults.length ? searchResults.map((p) => {
      S.people[p.username] = S.people[p.username] || p;
      const u = p.username;
      const action = S.friends.includes(u) ? `<button class="btn small ghost" data-chat="${esc(u)}">Chat</button>`
        : S.outgoing.includes(u) ? `<span class="tm label">gesendet</span>`
        : S.incoming.includes(u) ? `<button class="btn small" data-acc="${esc(u)}">Annehmen</button>`
        : `<button class="btn small" data-add="${esc(u)}">${I.userPlus} Adden</button>`;
      return `<div class="item" data-profile="${esc(u)}">${avatar(u)}<div class="ic"><div class="ir"><b>${esc(dn(u))}</b></div><div class="ir"><span class="pv">@${esc(u)}</span></div></div>${action}</div>`;
    }).join('') : `<div class="emptylist">Kein Nutzer gefunden.</div>`;
  }
  if (S.incoming.length) {
    h += `<div class="section label">Anfragen — ${S.incoming.length}</div>` + S.incoming.map((u) => `<div class="item" data-profile="${esc(u)}">${avatar(u)}<div class="ic"><div class="ir"><b>${esc(dn(u))}</b></div><div class="ir"><span class="pv">möchte mit dir befreundet sein</span></div></div><div class="acts2"><button class="ibtn" data-acc="${esc(u)}" title="Annehmen">${I.check}</button><button class="ibtn" data-dec="${esc(u)}" title="Ablehnen">${I.x}</button></div></div>`).join('');
  }
  if (S.outgoing.length) {
    h += `<div class="section label">Gesendet — ${S.outgoing.length}</div>` + S.outgoing.map((u) => `<div class="item" data-profile="${esc(u)}">${avatar(u)}<div class="ic"><div class="ir"><b>${esc(dn(u))}</b></div><div class="ir"><span class="pv">wartet auf Antwort</span></div></div><div class="acts2"><button class="ibtn" data-dec="${esc(u)}" title="Zurückziehen">${I.x}</button></div></div>`).join('');
  }
  const on = S.friends.filter((f) => P(f).online), off = S.friends.filter((f) => !P(f).online);
  const fItem = (u) => `<div class="item" data-chat="${esc(u)}">${avatar(u, '', true)}<div class="ic"><div class="ir"><b>${esc(dn(u))}</b></div><div class="ir"><span class="pv">${P(u).online ? 'Online' : 'Offline'}${P(u).pronouns ? ' · ' + esc(P(u).pronouns) : ''}</span></div></div><div class="acts2"><button class="ibtn" data-chat="${esc(u)}" title="Nachricht">${I.chat}</button><button class="ibtn" data-profile="${esc(u)}" title="Profil">${I.more}</button></div></div>`;
  if (on.length) h += `<div class="section label">Online — ${on.length}</div>` + on.map(fItem).join('');
  if (off.length) h += `<div class="section label">Offline — ${off.length}</div>` + off.map(fItem).join('');
  if (!S.friends.length && !q && !S.incoming.length && !S.outgoing.length) h += `<div class="emptylist">Noch keine Freunde.<br>Gib oben einen Username ein, um jemanden zu adden.</div>`;
  $('list').innerHTML = h;
}
$('search').oninput = () => {
  if (view === 'chats') return renderChats();
  clearTimeout(sTimer);
  const q = $('search').value.trim();
  if (!q) { searchResults = []; return renderFriends(); }
  sTimer = setTimeout(() => socket.emit('search', q, (list) => { searchResults = list; renderFriends(); }), 220);
};
$('searchIcon').innerHTML = I.search;

function setView(v) {
  view = v; $('search').value = ''; searchResults = [];
  if (window.innerWidth <= 760) closeChat(true);
  renderRail(); renderSide();
}

/* ================= Chat ================= */
function openConv(c) {
  if (!canOpen(c)) return;
  if (current !== c) { msgs = []; $('text').value = ''; autoGrow(); }
  current = c; unread[c] = 0; bumpTitle();
  if (window.innerWidth <= 760) panelMode = null;
  else if (panelMode === 'pins') panelMode = null;
  $('welcome').classList.add('hidden'); $('chat').classList.remove('hidden'); $('app').classList.add('chatting');
  renderHead(); renderMsgs(true); renderPinBar(); renderTyping(); renderRail(); renderSide();
  if (panelMode) renderPanel(); else $('panel').classList.add('hidden');
  socket.emit('history', c, (list) => { if (current !== c) return; msgs = list; renderMsgs(true); renderPinBar(); renderHead(); if (panelMode) renderPanel(); });
  if (window.innerWidth > 760) $('text').focus();
}
function closeChat(keepView) {
  current = null; panelMode = null;
  $('chat').classList.add('hidden'); $('welcome').classList.remove('hidden'); $('app').classList.remove('chatting'); $('panel').classList.add('hidden');
  if (!keepView) { renderSide(); }
}

function renderHead() {
  if (!current) return;
  const dm = isDM(current), g = grp(current), u = dm ? other(current) : null;
  const pins = msgs.filter((m) => m.pinned && !m.deleted).length;
  let st = '';
  if (dm) st = P(u).online ? '🟢 Online' : 'Offline';
  else if (g) { const on = g.members.filter((m) => m !== S.me && P(m).online).length; st = `${g.members.length} Mitglieder${on ? ` · ${on} online` : ''}`; }
  $('chatHead').innerHTML = `
    <button class="ibtn back" data-back>${I.back}</button>
    <div class="who-box" data-info>${convAvatar(current, '', true)}<div style="min-width:0"><div class="t">${esc(convTitle(current))}</div><div class="st">${esc(st)}</div></div></div>
    ${dm ? `<button class="ibtn" data-callaudio title="Anrufen">${I.phone}</button><button class="ibtn" data-callvideo title="Videoanruf">${I.video}</button>` : ''}
    <button class="ibtn ${panelMode === 'pins' ? 'on' : ''}" data-pins title="Angepinnte Nachrichten">${I.pin}${pins ? `<span class="badge">${pins}</span>` : ''}</button>
    <button class="ibtn ${panelMode === 'info' ? 'on' : ''}" data-info title="${dm ? 'Profil' : 'Gruppeninfo'}">${I.info}</button>`;
}

function renderPinBar() {
  const pins = msgs.filter((m) => m.pinned && !m.deleted);
  if (!current || !pins.length) return $('pinBar').classList.add('hidden');
  const l = pins[pins.length - 1];
  $('pinBar').classList.remove('hidden');
  $('pinBar').innerHTML = `${I.pin}<div class="pt"><b>Angepinnt${pins.length > 1 ? ` (${pins.length})` : ''}</b> · ${esc(dn(l.from))}: ${esc(l.text.split('\n')[0])}</div>`;

/* ================= Anrufe (WebRTC, 1:1) ================= */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
let pc = null, localStream = null, peer = null, pendingOffer = null, pendingIce = [], ringTone = null, timer;

function showCall(name, status, video) {
  peer = name;
  $('call').classList.remove('hidden');
  $('callAv').innerHTML = avatar(name, 'xl');
  $('callName').textContent = dn(name);
  $('callStatus').textContent = status;
  $('videos').classList.toggle('hidden', !video);
  $('callAv').classList.toggle('hidden', video);
  $('camBtn').classList.toggle('hidden', !video);
}
async function getMedia(video) {
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video });
  $('localV').srcObject = localStream;
}
function makePC() {

  pc.onicecandidate = (e) => e.candidate && socket.emit('call:ice', { to: peer, candidate: e.candidate });
  pc.ontrack = (e) => { $('remoteV').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === 'connected') { $('callAv').classList.remove('pulse'); startTimer(); }
    if (['failed', 'disconnected'].includes(pc.connectionState)) endCall(true, 'Verbindung verloren');
  };
}
function startTimer() { const t0 = Date.now(); clearInterval(timer); timer = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('callStatus').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 1000); }

async function startCall(u, video) {
  if (pc || pendingOffer) return;
  if (!navigator.mediaDevices) return toast('Anrufe brauchen HTTPS', 'Öffne die Seite über https:// oder localhost.');
  try { await getMedia(video); } catch { return toast('Kein Zugriff auf Mikrofon/Kamera.'); }
  showCall(u, 'Klingelt…', video);
  $('callAv').classList.add('pulse');
  $('acceptCall').classList.add('hidden');
  makePC();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('call:offer', { to: peer, sdp: offer, video });
}

function setupCalls() {
  socket.on('call:offer', (d) => {
    if (pc || pendingOffer) return socket.emit('call:decline', { to: d.from, busy: true });
    pendingOffer = d;
    showCall(d.from, d.video ? 'Eingehender Videoanruf…' : 'Eingehender Anruf…', false);
    $('acceptCall').classList.remove('hidden');
    $('callAv').classList.add('pulse');
    ring(true);
  });
  socket.on('call:answer', async (d) => { if (pc && d.from === peer) { await pc.setRemoteDescription(d.sdp); flushIce(); $('callStatus').textContent = 'Verbinde…'; } });
  socket.on('call:ice', (d) => { if (d.from !== peer) return; if (pc && pc.remoteDescription) pc.addIceCandidate(d.candidate).catch(() => {}); else pendingIce.push(d.candidate); });
  socket.on('call:end', (d) => { if (d.from === peer) endCall(true, 'Anruf beendet'); });
  socket.on('call:decline', (d) => { if (d.from === peer) endCall(true, d.busy ? 'Besetzt' : 'Anruf abgelehnt'); });
}
function flushIce() { if (!pc) return; pendingIce.forEach((c) => pc.addIceCandidate(c).catch(() => {})); pendingIce = []; }

$('acceptCall').onclick = async () => {
  const d = pendingOffer; pendingOffer = null; ring(false);
  try { await getMedia(d.video); } catch { toast('Kein Zugriff auf Mikrofon/Kamera.'); socket.emit('call:decline', { to: d.from }); return endCall(false); }
  showCall(d.from, 'Verbinde…', d.video);
  $('acceptCall').classList.add('hidden');
  makePC();
  await pc.setRemoteDescription(d.sdp);
  flushIce();
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('call:answer', { to: peer, sdp: answer });
};
$('hangup').onclick = () => {
  if (pendingOffer) { socket.emit('call:decline', { to: pendingOffer.from }); pendingOffer = null; }
  else if (peer) socket.emit('call:end', { to: peer });
  endCall(false);
};
function endCall(remote, msg) {
  ring(false); clearInterval(timer);
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  $('remoteV').srcObject = null; $('localV').srcObject = null;
  pendingOffer = null; pendingIce = []; peer = null;
  $('call').classList.add('hidden');
  $('muteBtn').classList.remove('off'); $('camBtn').classList.remove('off');
  if (remote && msg) toast(msg);
}
$('muteBtn').onclick = () => { if (!localStream) return; const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; $('muteBtn').classList.toggle('off', !t.enabled); };
$('camBtn').onclick = () => { if (!localStream) return; const t = localStream.getVideoTracks()[0]; if (!t) return; t.enabled = !t.enabled; $('camBtn').classList.toggle('off', !t.enabled); };

function ring(on) {
  if (!on) { if (ringTone) { clearInterval(ringTone.i); ringTone.ctx.close(); ringTone = null; } return; }
  try {
    const ctx = new AudioContext();
    const beep = () => { [0, .25].forEach((dt) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 680; g.gain.setValueAtTime(.12, ctx.currentTime + dt); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dt + .22); o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + dt); o.stop(ctx.currentTime + dt + .22); }); };
    beep(); ringTone = { ctx, i: setInterval(beep, 1800) };
  } catch {}
}
</script>
